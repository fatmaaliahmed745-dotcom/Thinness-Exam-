<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>index.html</title>
<style>
:root{--bg:#f6f8f5;--card:#fff;--tx:#1d2a22;--mu:#5d6b62;--pr:#2e7d5b;--bd:#d9e2dc;--bad:#c0392b;--ok:#1e8449;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a17;--card:#1d2621;--tx:#e8efe9;--mu:#9fb0a5;--pr:#5cc294;--bd:#33423a;--bad:#ff7b6b;--ok:#5fd68f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141a17;--card:#1d2621;--tx:#e8efe9;--mu:#9fb0a5;--pr:#5cc294;--bd:#33423a;--bad:#ff7b6b;--ok:#5fd68f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,"Segoe UI",Arial,sans-serif;line-height:1.7}
main{max-width:720px;margin:0 auto;padding:16px}
header{text-align:center;padding:12px 0}
header h1{font-size:1.25rem;margin:6px 0}header p{color:var(--mu);margin:2px 0;font-size:.9rem}
.logo{width:200px;max-width:70%;height:auto;margin:0 auto;display:block;background:#fff;border-radius:12px;padding:6px}#tm{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--pr);color:#fff;text-align:center;border-radius:10px;padding:6px;margin:8px 0;font-weight:bold}details{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;margin:14px 0}summary{cursor:pointer;font-weight:bold;color:var(--pr)}.sol p{margin:6px 0}
h2{font-size:1.05rem;color:var(--pr);margin:26px 0 8px;border-bottom:2px solid var(--bd);padding-bottom:4px}
.q{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:10px 0}
.q.wrong{border-color:var(--bad)}.q.right{border-color:var(--ok)}
.q b{display:block;margin-bottom:6px}.pt{color:var(--mu);font-size:.8rem;font-weight:normal}
label{display:block;padding:6px 8px;border-radius:8px;cursor:pointer}label:hover{background:var(--bg)}
input[type=radio],input[type=checkbox]{margin-inline-end:8px}
input[type=number],input[type=text]{width:100%;box-sizing:border-box;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-size:1rem}
.sub{margin-top:8px;padding-top:8px;border-top:1px dashed var(--bd)}
button{background:var(--pr);color:#fff;border:0;border-radius:10px;padding:14px;font-size:1.05rem;width:100%;margin-top:20px;cursor:pointer}
button:disabled{opacity:.5}
#res{background:var(--card);border:2px solid var(--pr);border-radius:14px;padding:16px;margin:20px 0;text-align:center}
#res .big{font-size:2.4rem;color:var(--pr);font-weight:bold}
table{width:100%;border-collapse:collapse;font-size:.9rem}td,th{padding:6px;border-bottom:1px solid var(--bd);text-align:center}
.wrap{overflow-x:auto}.mu{color:var(--mu);font-size:.85rem}
</style>
</head>

function opt(t,n,v,x){const l=document.createElement('label');const i=document.createElement('input');i.type=t;i.name=n;i.value=v;l.appendChild(i);l.appendChild(document.createTextNode(x));return l;}
const val=n=>{const r=document.querySelector('[name="'+n+'"]:checked');return r?+r.value:null};
function grade(q){const n='q'+q.id;
if(q.t==='mc')return val(n)===q.a?q.p:0;
if(q.t==='num'){const v=parseFloat(document.querySelector('[name="'+n+'"]').value);return Math.abs(v-q.a)<=q.tol?q.p:0;}
if(q.t==='multi'){const c=[...document.querySelectorAll('[name="'+n+'"]:checked')].map(x=>+x.value);const h=c.filter(x=>q.a.includes(x)).length,w=c.length-h;return Math.max(0,h-w)/q.a.length*q.p;}
if(q.t==='tf'){const v=val(n);const ans=q.a?0:1;if(v!==ans)return 0;return q.a?2:1+(val('c'+q.id)===0?1:0);}}
